<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แอพพนักงานสำรวจภัย (Surveyor Receiver)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    }
    @keyframes incomingPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.45); }
      50% { box-shadow: 0 0 0 12px rgba(244, 63, 94, 0); }
    }
    .incoming-pulse {
      animation: incomingPulse 1.5s infinite;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-xl mx-auto p-4 space-y-5">
    <!-- Header + Sound Settings -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg font-bold text-white">หน้าพนักงานรับงาน</h1>
          <span id="dbStatus" class="text-[11px] px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
            กำลังเชื่อมต่อ...
          </span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">ระบบกันลักไก่ • ตรวจสถานะจากงานค้างจริง</p>
      </div>

      <button onclick="openSoundModal()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-white shrink-0">
        ⚙ ตั้งค่าเสียงเตือน
      </button>
    </div>

    <!-- Worker Selector & Smart Status -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1.5">เลือกบัญชีพนักงาน</label>
        <select id="workerSelect" onchange="onSelectWorker()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none">
          <option value="">-- กำลังโหลดรายชื่อพนักงาน --</option>
        </select>
      </div>

      <div id="workerCard" class="hidden space-y-3 pt-1">
        <div class="flex items-center justify-between gap-3 bg-slate-950/80 border border-slate-800 rounded-xl p-3">
          <div>
            <div id="wName" class="font-bold text-white text-base">-</div>
            <div id="wPhone" class="text-xs text-slate-400">-</div>
          </div>
          <div class="text-right">
            <span id="wAvailBadge" class="inline-block px-3 py-1 rounded-full text-xs font-bold">-</span>
            <div id="wLockNote" class="text-[11px] text-rose-400 mt-1 hidden">ติดงานค้าง • ระบบล็อกสถานะไม่ว่าง</div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <button id="btnGoOnline" onclick="setOnlineMode(true)" class="py-2.5 px-3 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-500 text-white">
            เปิดออนไลน์
          </button>
          <button id="btnGoOffline" onclick="setOnlineMode(false)" class="py-2.5 px-3 rounded-xl font-bold text-sm bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200">
            ปิดออฟไลน์
          </button>
        </div>

        <div class="flex items-center justify-between text-xs bg-slate-950/60 border border-slate-800/80 rounded-xl px-3.5 py-2.5">
          <span id="ringStatusText" class="text-slate-300">เสียงเตือน: พร้อมทำงาน</span>
          <button id="btnStopRing" onclick="stopAllAlarmLoops()" class="hidden px-2.5 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-semibold">
            หยุดเสียงงานนี้
          </button>
        </div>
      </div>
    </div>

    <!-- Active / Open Jobs -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-white">งานรอรับ & งานของฉัน</h2>
        <span id="activeJobCount" class="text-xs text-slate-400">0 งาน</span>
      </div>
      <div id="jobsContainer" class="space-y-3">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center text-xs text-slate-500">
          เลือกพนักงานเพื่อดูงานที่เข้าและงานที่รับไว้
        </div>
      </div>
    </div>
  </div>

  <!-- Sound Settings Modal -->
  <div id="soundModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-white">ตั้งค่าเสียงเตือนงานเข้า</h3>
        <button onclick="closeSoundModal()" class="text-slate-400 hover:text-white text-sm">ปิด</button>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs text-slate-400 mb-1">รูปแบบเสียงเตือน</label>
          <select id="soundTone" onchange="saveSoundSettings()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white">
            <option value="bell">กระดิ่งฉุกเฉิน</option>
            <option value="siren">ไซเรนด่วน</option>
            <option value="chime">กริ่งเรียกงาน</option>
            <option value="rapid">โทนจังหวะถี่</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">ระยะห่างการดังซ้ำ (วินาที)</label>
          <select id="soundInterval" onchange="saveSoundSettings()" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white">
            <option value="1500">ทุก 1.5 วินาที</option>
            <option value="2500">ทุก 2.5 วินาที</option>
            <option value="4000">ทุก 4 วินาที</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">ระดับความดัง (<span id="volLabel">85</span>%)</label>
          <input id="soundVolume" type="range" min="10" max="100" value="85" oninput="document.getElementById('volLabel').textContent=this.value; saveSoundSettings()" class="w-full" />
        </div>

        <label class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 cursor-pointer">
          <span class="text-xs text-slate-200 font-semibold">ดังต่อเนื่องจนกว่าจะมีคนรับหรือหมดเวลา</span>
          <input id="soundLoopEnabled" type="checkbox" checked onchange="saveSoundSettings()" class="w-4 h-4 accent-emerald-500" />
        </label>
      </div>

      <div class="flex gap-2 pt-1">
        <button onclick="previewSound()" class="flex-1 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white">
          ฟังตัวอย่างเสียง
        </button>
        <button onclick="closeSoundModal()" class="flex-1 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white">
          บันทึกและปิด
        </button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCcPXE_aQWhPwF5QtDf6FgvWC_mPUZ5EIA",
      authDomain: "surveyor-dispatch-v1.firebaseapp.com",
      databaseURL: "https://surveyor-dispatch-v1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "surveyor-dispatch-v1",
      storageBucket: "surveyor-dispatch-v1.firebasestorage.app",
      messagingSenderId: "578294203979",
      appId: "1:578294203979:web:b5f497724d1f077d00afce",
      measurementId: "G-91LPHY3DV3"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let workers = {};
    let jobs = {};
    let currentWorkerId = localStorage.getItem("selected_surveyor_id") || "";
    let audioCtx = null;
    const activeAlarmTimers = new Map();
    const mutedJobIds = new Set();

    const soundConfig = {
      tone: localStorage.getItem("alert_tone") || "bell",
      intervalMs: Number(localStorage.getItem("alert_interval_ms") || 2500),
      volume: Number(localStorage.getItem("alert_volume") || 85),
      loop: localStorage.getItem("alert_loop") !== "false"
    };

    function syncSoundInputs() {
      document.getElementById("soundTone").value = soundConfig.tone;
      document.getElementById("soundInterval").value = String(soundConfig.intervalMs);
      document.getElementById("soundVolume").value = String(soundConfig.volume);
      document.getElementById("volLabel").textContent = String(soundConfig.volume);
      document.getElementById("soundLoopEnabled").checked = soundConfig.loop;
    }

    function saveSoundSettings() {
      soundConfig.tone = document.getElementById("soundTone").value;
      soundConfig.intervalMs = Number(document.getElementById("soundInterval").value);
      soundConfig.volume = Number(document.getElementById("soundVolume").value);
      soundConfig.loop = document.getElementById("soundLoopEnabled").checked;

      localStorage.setItem("alert_tone", soundConfig.tone);
      localStorage.setItem("alert_interval_ms", String(soundConfig.intervalMs));
      localStorage.setItem("alert_volume", String(soundConfig.volume));
      localStorage.setItem("alert_loop", String(soundConfig.loop));
      syncAlarmsWithState();
    }

    function openSoundModal() {
      syncSoundInputs();
      const m = document.getElementById("soundModal");
      m.classList.remove("hidden");
      m.classList.add("flex");
    }

    function closeSoundModal() {
      const m = document.getElementById("soundModal");
      m.classList.add("hidden");
      m.classList.remove("flex");
    }

    function ensureAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playToneOnce(tone = soundConfig.tone, volPct = soundConfig.volume) {
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const gainVal = Math.max(0.01, Math.min(1, (volPct / 100) * 0.35));

      const notes =
        tone === "siren"
          ? [520, 780, 520, 780]
          : tone === "chime"
          ? [659.25, 880, 1046.5]
          : tone === "rapid"
          ? [920, 920, 1180, 920]
          : [880, 660, 880];

      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = tone === "siren" ? "sawtooth" : "triangle";
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.001, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(gainVal, now + idx * 0.12 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.11);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.12);
      });
    }

    function previewSound() {
      playToneOnce(soundConfig.tone, soundConfig.volume);
    }

    function stopAlarmForJob(jobId) {
      const timer = activeAlarmTimers.get(jobId);
      if (timer) {
        clearInterval(timer);
        activeAlarmTimers.delete(jobId);
      }
      updateRingIndicator();
    }

    function stopAllAlarmLoops() {
      Object.keys(jobs).forEach((id) => {
        if (activeAlarmTimers.has(id)) mutedJobIds.add(id);
        stopAlarmForJob(id);
      });
      renderJobs();
    }

    function updateRingIndicator() {
      const count = activeAlarmTimers.size;
      const textEl = document.getElementById("ringStatusText");
      const stopBtn = document.getElementById("btnStopRing");
      if (count > 0) {
        textEl.textContent = `กำลังดังแจ้งเตือนงานเข้า (${count} งาน)`;
        textEl.className = "text-rose-400 font-semibold";
        stopBtn.classList.remove("hidden");
      } else {
        textEl.textContent = "เสียงเตือน: พร้อมทำงาน";
        textEl.className = "text-slate-300";
        stopBtn.classList.add("hidden");
      }
    }

    // ตัวช่วยกันลักไก่: เช็กว่าพนักงานคนนี้มีงานที่รับไว้แล้วแต่ยังไม่ปิด/ยังไม่ยืนยันใบเคลมหรือไม่
    function hasUnfinishedJob(workerId) {
      if (!workerId) return false;
      return Object.values(jobs).some((j) => {
        if (!j || j.assignedTo !== workerId) return false;
        const notFinished = j.status !== "completed" && j.status !== "cancelled";
        const claimNotConfirmed = !j.claimLocked;
        return notFinished || claimNotConfirmed;
      });
    }

    // บังคับซิงก์สถานะว่าง/ไม่ว่างตามความจริง (ติดงานค้าง = ไม่ว่างเสมอ / ว่างจริง = ตามออนไลน์-ออฟไลน์)
    async function reconcileWorkerAvailability(workerId) {
      const w = workers[workerId];
      if (!w) return;

      const lockedByJob = hasUnfinishedJob(workerId);
      const expectedAvailable = lockedByJob ? false : !!w.isOnline;

      if (w.isAvailable !== expectedAvailable) {
        await db.ref(`surveyors/${workerId}`).update({
          isAvailable: expectedAvailable
        });
      }
    }

    async function setOnlineMode(goOnline) {
      ensureAudioContext();
      if (!currentWorkerId || !workers[currentWorkerId]) return;

      const lockedByJob = hasUnfinishedJob(currentWorkerId);
      // ถ้าติดงานค้างอยู่ ต่อให้กดเปิดออนไลน์ สถานะรับงานก็ยังเป็นไม่ว่าง (false)
      const nextAvailable = lockedByJob ? false : !!goOnline;

      await db.ref(`surveyors/${currentWorkerId}`).update({
        isOnline: !!goOnline,
        isAvailable: nextAvailable
      });
    }

    function onSelectWorker() {
      ensureAudioContext();
      currentWorkerId = document.getElementById("workerSelect").value;
      localStorage.setItem("selected_surveyor_id", currentWorkerId);
      renderWorkerCard();
      reconcileWorkerAvailability(currentWorkerId);
      syncAlarmsWithState();
      renderJobs();
    }

    function syncAlarmsWithState() {
      const now = Date.now();
      const w = workers[currentWorkerId];
      const canReceiveNow = !!(w && w.isOnline && w.isAvailable && !hasUnfinishedJob(currentWorkerId));

      for (const [id, job] of Object.entries(jobs)) {
        const deadline = job.expiresAt || ((job.createdAt || now) + 30000);
        const isValidOpen =
          canReceiveNow &&
          job &&
          job.status === "open" &&
          !job.assignedTo &&
          now < deadline &&
          !mutedJobIds.has(id);

        if (!isValidOpen) {
          stopAlarmForJob(id);
        } else if (!activeAlarmTimers.has(id)) {
          playToneOnce(soundConfig.tone, soundConfig.volume);
          if (soundConfig.loop) {
            const t = setInterval(() => {
              const curJob = jobs[id];
              const curW = workers[currentWorkerId];
              const curDeadline = (curJob && (curJob.expiresAt || ((curJob.createdAt || 0) + 30000))) || 0;
              if (
                !curJob ||
                curJob.status !== "open" ||
                curJob.assignedTo ||
                Date.now() >= curDeadline ||
                !curW ||
                !curW.isOnline ||
                !curW.isAvailable ||
                mutedJobIds.has(id)
              ) {
                stopAlarmForJob(id);
                return;
              }
              playToneOnce(soundConfig.tone, soundConfig.volume);
            }, soundConfig.intervalMs);
            activeAlarmTimers.set(id, t);
          }
        }
      }
      updateRingIndicator();
    }

    async function claimJob(jobId) {
      ensureAudioContext();
      if (!currentWorkerId) return;
      const w = workers[currentWorkerId];
      if (!w || !w.isOnline || !w.isAvailable || hasUnfinishedJob(currentWorkerId)) return;

      const now = Date.now();
      let claimed = false;

      await db.ref(`dispatchJobs/${jobId}`).transaction((curr) => {
        if (!curr || curr.status !== "open" || curr.assignedTo) return curr;
        const deadline = curr.expiresAt || ((curr.createdAt || now) + 30000);
        if (Date.now() >= deadline) return curr;
        claimed = true;
        return {
          ...curr,
          status: "in_progress",
          assignedTo: currentWorkerId,
          assignedToName: w.name,
          assignedToPhone: w.phone || "",
          acceptedAt: Date.now()
        };
      });

      if (claimed) {
        stopAlarmForJob(jobId);
        await db.ref(`surveyors/${currentWorkerId}`).update({
          isAvailable: false,
          jobsToday: (w.jobsToday || 0) + 1,
          lastJobAt: Date.now()
        });
      }
    }

    function onClaimFileChange(jobId, inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        await db.ref(`dispatchJobs/${jobId}`).update({
          claimImage: reader.result,
          claimLocked: false
        });
      };
      reader.readAsDataURL(file);
    }

    async function confirmAndLockClaim(jobId) {
      const job = jobs[jobId];
      if (!job || !job.claimImage) {
        alert("กรุณาเลือกรูปใบเคลม 1 รูปก่อนยืนยันปิดงานครับ");
        return;
      }

      await db.ref(`dispatchJobs/${jobId}`).update({
        claimLocked: true,
        status: "completed",
        completedAt: Date.now()
      });

      // เมื่อยืนยันรูปใบเคลมและปิดงานครบแล้ว ค่อยปลดล็อกให้กลับเป็นว่าง (ถ้ายังออนไลน์อยู่)
      if (currentWorkerId && job.assignedTo === currentWorkerId) {
        await reconcileWorkerAvailability(currentWorkerId);
      }
    }

    function renderWorkerSelect() {
      const sel = document.getElementById("workerSelect");
      const entries = Object.entries(workers);
      sel.innerHTML =
        `<option value="">-- เลือกพนักงาน --</option>` +
        entries.map(([id, w]) => `<option value="${id}" ${id === currentWorkerId ? "selected" : ""}>${w.name || id}</option>`).join("");
    }

    function renderWorkerCard() {
      const card = document.getElementById("workerCard");
      const w = workers[currentWorkerId];
      if (!w) {
        card.classList.add("hidden");
        return;
      }
      card.classList.remove("hidden");
      document.getElementById("wName").textContent = w.name || currentWorkerId;
      document.getElementById("wPhone").textContent = `เบอร์โทร: ${w.phone || "-"} • งานวันนี้: ${w.jobsToday || 0} งาน`;

      const lockedByJob = hasUnfinishedJob(currentWorkerId);
      const badge = document.getElementById("wAvailBadge");
      const lockNote = document.getElementById("wLockNote");

      if (lockedByJob) {
        badge.textContent = "ไม่ว่าง (ติดงานค้าง)";
        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40";
        lockNote.classList.remove("hidden");
      } else if (w.isOnline && w.isAvailable) {
        badge.textContent = "ออนไลน์ • ว่างพร้อมรับงาน";
        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
        lockNote.classList.add("hidden");
      } else {
        badge.textContent = w.isOnline ? "ออนไลน์ • ไม่ว่าง" : "ออฟไลน์ • ไม่ว่าง";
        badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-slate-700 text-slate-300 border border-slate-600";
        lockNote.classList.add("hidden");
      }
    }

    function renderJobs() {
      const container = document.getElementById("jobsContainer");
      const countEl = document.getElementById("activeJobCount");

      if (!currentWorkerId || !workers[currentWorkerId]) {
        countEl.textContent = "0 งาน";
        container.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center text-xs text-slate-500">เลือกพนักงานเพื่อดูงาน</div>`;
        return;
      }

      const w = workers[currentWorkerId];
      const now = Date.now();
      const lockedByJob = hasUnfinishedJob(currentWorkerId);

      const visibleJobs = Object.entries(jobs)
        .map(([id, j]) => ({ id, ...j }))
        .filter((j) => {
          const deadline = j.expiresAt || ((j.createdAt || now) + 30000);
          const isOpenForMe = j.status === "open" && !j.assignedTo && now < deadline && w.isOnline && w.isAvailable && !lockedByJob;
          const isMineActive = j.assignedTo === currentWorkerId && (j.status !== "completed" || !j.claimLocked);
          return isOpenForMe || isMineActive;
        })
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      countEl.textContent = `${visibleJobs.length} งาน`;
      if (!visibleJobs.length) {
        container.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center text-xs text-slate-400">ยังไม่มีงานรอรับหรืองานค้าง</div>`;
        return;
      }

      container.innerHTML = visibleJobs.map((j) => {
        if (j.status === "open" && !j.assignedTo) {
          const deadline = j.expiresAt || ((j.createdAt || now) + 30000);
          const remSec = Math.max(0, Math.ceil((deadline - now) / 1000));
          return `
            <div class="bg-slate-900 border-2 border-rose-500/60 incoming-pulse rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300">งานด่วนเข้าใหม่!</span>
                <span class="text-xs font-mono font-bold text-rose-400">หมดเวลาใน ${remSec} วิ</span>
              </div>
              <div class="text-lg font-extrabold text-white">${j.plateNumber || "-"}</div>
              <button onclick="claimJob('${j.id}')" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-sm text-white">
                รับงานนี้ทันที
              </button>
            </div>
          `;
        }

        const isLocked = !!j.claimLocked;
        return `
          <div class="bg-slate-900 border border-sky-500/40 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-sky-500/20 text-sky-300">
                ${isLocked ? "ปิดงานแล้ว (ล็อกถาวร)" : "งานของฉัน • รอส่งรูปใบเคลม"}
              </span>
              <span class="text-xs text-slate-400">${isLocked ? "เสร็จสมบูรณ์" : "ต้องแนบรูปเพื่อปลดล็อกว่าง"}</span>
            </div>
            <div class="text-lg font-extrabold text-white">${j.plateNumber || "-"}</div>

            ${j.claimImage ? `<img src="${j.claimImage}" alt="ใบเคลม" class="w-full max-h-56 object-contain rounded-xl bg-slate-950 border border-slate-800" />` : ""}

            ${
              !isLocked
                ? `
                  <div class="space-y-2">
                    <input type="file" accept="image/*" onchange="onClaimFileChange('${j.id}', this)" class="block w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-700" />
                    <button onclick="confirmAndLockClaim('${j.id}')" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm text-white">
                      ยืนยันรูปใบเคลมและปิดงาน (ล็อกถาวร)
                    </button>
                  </div>
                `
                : `<div class="text-xs text-emerald-400 font-semibold">ยืนยันรูปใบเคลมเรียบร้อยแล้ว</div>`
            }
          </div>
        `;
      }).join("");
    }

    db.ref(".info/connected").on("value", (snap) => {
      const el = document.getElementById("dbStatus");
      if (snap.val() === true) {
        el.textContent = "เชื่อมต่อแล้ว";
        el.className = "text-[11px] px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
      } else {
        el.textContent = "กำลังเชื่อมต่อ...";
        el.className = "text-[11px] px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30";
      }
    });

    db.ref("surveyors").on("value", (snap) => {
      workers = snap.val() || {};
      renderWorkerSelect();
      renderWorkerCard();
      if (currentWorkerId && workers[currentWorkerId]) {
        reconcileWorkerAvailability(currentWorkerId);
      }
      syncAlarmsWithState();
      renderJobs();
    });

    db.ref("dispatchJobs").on("value", (snap) => {
      jobs = snap.val() || {};
      if (currentWorkerId && workers[currentWorkerId]) {
        reconcileWorkerAvailability(currentWorkerId);
      }
      renderWorkerCard();
      syncAlarmsWithState();
      renderJobs();
    });

    setInterval(() => {
      syncAlarmsWithState();
      renderJobs();
    }, 1000);
  </script>
</body>
</html>
